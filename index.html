<style id="css">
/* 레이아웃: 위에 달·도구 막대, 아래에 직원×날짜 표 한 장. 색은 휴무/연차·휴가 두 가지만 강조. */
:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #1c1f24; --muted: #6a7079; --line: #cfd3d9;
  --accent: #1f4f8f; --accent-ink: #ffffff; --red: #d6262b; --ev: #6b3fa0; --sep: #e9ebee;
  --off: #bfbfbf; --cell-ink: #1c1f24; --today: #fff6d6;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #15171b; --panel: #1e2126; --ink: #e8eaed; --muted: #9aa1ab; --line: #3a3f47;
    --accent: #7fb0ee; --accent-ink: #10151c; --red: #ff7a7d; --ev: #c3a1ee; --sep: #2a2e35; --today: #3a3420;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #15171b; --panel: #1e2126; --ink: #e8eaed; --muted: #9aa1ab; --line: #3a3f47;
  --accent: #7fb0ee; --accent-ink: #10151c; --red: #ff7a7d; --ev: #c3a1ee; --sep: #2a2e35; --today: #3a3420;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.4; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.wrap { max-width: 1500px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.month { display: flex; align-items: center; gap: 6px; }
.month h1 { font-size: 22px; font-weight: 700; margin: 0 6px; min-width: 150px; text-align: center; font-variant-numeric: tabular-nums; }
.spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 7px 12px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.icon { padding: 7px 11px; }
.btn.small { padding: 3px 8px; font-size: 12px; }
.btn.danger { color: var(--red); }
.btn:disabled { opacity: .45; cursor: default; }
#status { color: var(--muted); font-size: 12px; }

.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.tools .hint { color: var(--muted); font-size: 12px; }
.palette { display: flex; flex-wrap: wrap; gap: 6px; }
.tool { border: 2px solid transparent; border-radius: 6px; padding: 5px 12px; font-weight: 600; color: var(--cell-ink); background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.tool.k-work { color: var(--ink); }
.tool[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.colors { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
.colors label { display: flex; align-items: center; gap: 4px; }
.colors input { width: 28px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; }

.gridbox { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
table.grid { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1120px; table-layout: fixed; user-select: none; -webkit-user-select: none; font-variant-numeric: tabular-nums; }
.grid th, .grid td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: center; padding: 0; height: 32px; font-weight: 500; overflow: hidden; }
.grid col.c-name { width: 104px; } .grid col.c-sum { width: 44px; }
.grid .name { position: sticky; left: 0; z-index: 2; background: var(--panel); text-align: left; }
.grid thead .name { text-align: center; font-weight: 700; font-size: 15px; }
.grid thead th { background: var(--panel); font-weight: 600; }
.grid th.red, .grid td.red { color: var(--red); }
.grid th.today { background: var(--today); }
.grid th.dbtn { cursor: pointer; }
.grid th.dbtn:hover { background: var(--sep); }
.grid tr.notes th { height: auto; min-height: 8px; font-size: 11px; line-height: 1.2; font-weight: 600; padding: 3px 1px; vertical-align: top; word-break: break-all; }
.grid .n-hol { color: var(--red); display: block; } .grid .n-ev { color: var(--ev); display: block; }
.grid tr.gsep td { height: 20px; background: var(--sep); text-align: left; font-size: 11px; font-weight: 700; color: var(--muted); padding-left: 8px; position: sticky; left: 0; }
.grid .name .no { display: inline-block; width: 24px; text-align: center; color: var(--muted); font-size: 12px; }
.grid .name button { border: 0; background: none; padding: 6px 2px; font-weight: 600; max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
.grid .name button:hover { color: var(--accent); text-decoration: underline; }
.grid td.cell { cursor: pointer; font-size: 12px; font-weight: 600; color: var(--cell-ink); }
.grid td.cell:hover { box-shadow: inset 0 0 0 2px var(--accent); }
.grid td.cell.s3 { font-size: 11px; letter-spacing: -0.3px; }
.grid td.cell.s4 { font-size: 10px; letter-spacing: -0.5px; }
.grid .wk { border-left: 2px solid var(--ink); }
.grid th.sum { font-size: 11px; line-height: 1.15; word-break: keep-all; padding: 0 2px; }
.trow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 2px; border-top: 1px solid var(--line); }
.trow:first-child { border-top: 0; }
.trow input[type=text] { width: 120px; font-weight: 600; }
.trow input[type=color] { width: 44px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 5px; background: none; }
.trow .chip { min-width: 64px; text-align: center; border-radius: 6px; padding: 5px 10px; font-weight: 600; font-size: 12px; }
.grid td.sum { color: var(--muted); font-size: 12px; }
.grid tfoot th, .grid tfoot td { font-weight: 700; height: 34px; background: var(--panel); }
.grid tfoot .name { text-align: center; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); padding: 0; width: min(1000px, calc(100vw - 24px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgba(0,0,0,.45); }
.dlg-head { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
.dlg-head h2 { margin: 0; font-size: 17px; flex: 1; }
.dlg-body { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 14px; }
.note { color: var(--muted); font-size: 12px; margin: 0; }
.grp { border: 1px solid var(--line); border-radius: 8px; }
.grp-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 10px; background: var(--sep); border-radius: 8px 8px 0 0; }
.grp-head input[type=text] { font-weight: 700; width: 120px; }
.srow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 10px; border-top: 1px solid var(--line); }
.srow input[type=text] { width: 96px; }
input[type=text], input[type=date], select { border: 1px solid var(--line); border-radius: 5px; padding: 5px 7px; background: var(--panel); }
.days { display: flex; gap: 3px; }
.day { width: 28px; height: 28px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel); padding: 0; font-size: 12px; }
.day[aria-pressed="true"] { background: var(--off); color: var(--cell-ink); border-color: var(--muted); font-weight: 700; }
.lbl { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.grp-foot { padding: 8px 10px; border-top: 1px solid var(--line); }
.addform { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.addform input[type=text] { flex: 1; min-width: 140px; }
.list { display: flex; flex-direction: column; }
.list .li { display: flex; align-items: center; gap: 10px; padding: 6px 2px; border-top: 1px solid var(--line); }
.list .li:first-child { border-top: 0; }
.list .li .dt { width: 108px; color: var(--muted); font-variant-numeric: tabular-nums; }
.list .li .nm { flex: 1; }
h3 { font-size: 14px; margin: 0 0 6px; }
body.ro .tools, body.ro #undo, body.ro #openStaff, body.ro #openEvents, body.ro #pubSnap { display: none; }
body.ro .grid td.cell, body.ro .grid th.dbtn { cursor: default; }
body.ro .grid td.cell:hover { box-shadow: none; }
body.ro .grid th.dbtn:hover { background: var(--panel); }
body.ro .grid th.dbtn.today:hover { background: var(--today); }
body.ro .grid .name button { pointer-events: none; }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 13px; display: none; z-index: 20; max-width: calc(100vw - 32px); }

/* ---------- 매장 관리: 하단 시트 탭 + 급여계산기 ---------- */
body { padding-bottom: 52px; }
#toast { bottom: 66px; }
#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; align-items: flex-start; gap: 2px; height: 44px; padding: 0 12px; background: var(--sep); border-top: 1px solid var(--line); overflow-x: auto; }
#tabs .brand { align-self: center; font-weight: 700; font-size: 13px; color: var(--muted); padding: 0 12px 0 4px; white-space: nowrap; }
#tabs .tab { height: 34px; margin-top: -1px; padding: 0 18px; border: 1px solid var(--line); border-radius: 0 0 8px 8px; background: var(--bg); color: var(--muted); font-weight: 600; white-space: nowrap; }
#tabs .tab:hover { color: var(--ink); }
#tabs .tab[aria-pressed="true"] { background: var(--panel); color: var(--accent); border-top-color: var(--panel); box-shadow: inset 0 -3px 0 var(--accent); }
#pay { --surface: var(--panel); --sunken: color-mix(in srgb, var(--ink) 4%, var(--panel)); --accent-soft: color-mix(in srgb, var(--accent) 13%, var(--panel)); --minus: var(--red); --on-accent: var(--accent-ink);
  max-width: 1120px; margin: 0 auto; padding: 16px; font-size: 14.5px; line-height: 1.5; font-variant-numeric: tabular-nums; }
#pay .ptop { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; margin-bottom: 14px; }
#pay .ptitle { font-size: 22px; font-weight: 700; }
#pay .psub { color: var(--muted); font-size: 12.5px; }
#pay .pactions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
#pay .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
#pay .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
#pay .card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
#pay .card h2 { font-size: 15px; font-weight: 600; margin: 0 0 4px; display: flex; align-items: baseline; gap: 8px; }
#pay .card h2 .step { color: var(--accent); font-size: 12px; font-weight: 700; }
#pay .card .hint { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }
#pay .who { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
#pay .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
#pay .field > label, #pay .plbl { font-size: 12.5px; color: var(--muted); }
#pay input[type="text"], #pay input[type="month"], #pay select { width: 100%; min-width: 0; height: 38px; padding: 0 10px; background: var(--sunken); border: 1px solid var(--line); border-radius: 7px; }
#pay input.num { text-align: right; }
#pay .rows { display: flex; flex-direction: column; }
#pay .row { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 0.9fr); gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); }
#pay .row:first-child { border-top: 0; }
#pay .row .name { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
#pay .rate { font-size: 11.5px; padding: 1px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
#pay .calc { text-align: right; color: var(--muted); white-space: nowrap; }
#pay .calc.minus { color: var(--minus); }
#pay .calc.plus { color: var(--accent); }
#pay .result { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 12px; margin-top: 10px; background: var(--sunken); border-radius: 7px; }
#pay .result + .result { margin-top: 6px; }
#pay .result b { font-weight: 600; font-size: 16px; }
#pay .result small { display: block; color: var(--muted); font-size: 12px; }
#pay .tablewrap { overflow-x: auto; }
#pay table { border-collapse: collapse; width: 100%; }
#pay .retail th, #pay .retail td { padding: 6px; border-top: 1px solid var(--line); text-align: right; }
#pay .retail th:first-child, #pay .retail td:first-child { text-align: left; padding-left: 0; }
#pay .retail thead th { border-top: 0; font-size: 12.5px; color: var(--muted); font-weight: 500; }
#pay .retail td:first-child { min-width: 118px; }
#pay .retail input { min-width: 104px; }
#pay .retail tr.sum td { background: var(--sunken); font-weight: 600; }
#pay .retail tr.sum td:first-child { padding-left: 8px; }
#pay .ref { margin-top: 8px; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#pay button { height: 36px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; }
#pay button:hover { border-color: var(--accent); }
#pay button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
#pay button.link { height: auto; padding: 2px 8px; font-size: 12.5px; color: var(--accent); border-color: var(--accent-soft); background: var(--accent-soft); }
#pay .tiers th, #pay .tiers td { padding: 6px 8px; text-align: center; border: 1px solid var(--line); font-size: 12.5px; white-space: nowrap; }
#pay .tiers th { color: var(--muted); font-weight: 500; background: var(--sunken); }
#pay .tiers td:first-child, #pay .tiers th:first-child { text-align: left; }
#pay .tiers tr.on td:first-child { font-weight: 700; color: var(--accent); }
#pay .tiers td.on { background: var(--accent); color: var(--on-accent); font-weight: 700; border-color: var(--accent); }
#pay .pctline { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 12px; }
#pay .pctline label.chk { display: flex; align-items: center; gap: 6px; font-size: 13px; }
#pay .pctline input[type="text"] { width: 84px; }
#pay .pctbig { font-size: 22px; font-weight: 700; color: var(--accent); }
#pay .slip { position: sticky; top: 16px; padding: 0; overflow: hidden; }
#pay .slip .head { background: var(--accent); color: var(--on-accent); padding: 16px; }
#pay .slip .head .who-line { font-size: 12.5px; opacity: 0.85; min-height: 19px; }
#pay .slip .head .plbl { color: inherit; opacity: 0.85; }
#pay .slip .net { font-size: 32px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
#pay .slip .body { padding: 8px 16px 16px; }
#pay .slip dl { margin: 0; }
#pay .slip .ln { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); }
#pay .slip .ln:first-child { border-top: 0; }
#pay .slip dt { color: var(--muted); }
#pay .slip dd { margin: 0; text-align: right; white-space: nowrap; }
#pay .slip .ln.strong dt, #pay .slip .ln.strong dd { color: var(--ink); font-weight: 700; }
#pay .slip .ln.minus dd { color: var(--minus); }
#pay .slip .foot { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
#pay .slip .foot span { font-size: 12.5px; color: var(--muted); }
#pay .pnote { font-size: 12.5px; color: var(--muted); margin: 0; }
#pay .badge { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 99px; border: 1px dashed var(--accent); color: var(--accent); }
#pay[hidden], #tab-schedule[hidden], #pay [hidden] { display: none !important; }
@media (max-width: 900px) { #pay .layout { grid-template-columns: minmax(0, 1fr); } #pay .slip { position: static; } }
@media (max-width: 480px) {
  #pay .who { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  #pay .row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  #pay .row .calc { grid-column: 1 / -1; padding-bottom: 2px; }
  #pay .card { padding: 12px; }
}
</style>

<script id="snap" type="application/json">null</script>
<script id="core">
/* ---------- 공통 로직 (화면과 무관) ---------- */
/* 입력 종류(휴무·연차·교육 등). 'O'(휴무)는 고정 휴무에 쓰여 지울 수 없다. */
const DEFAULT_TYPES = [
  { id: 'O', label: '휴무', color: '#bfbfbf', sum: true },
  { id: 'A', label: '연/월차', color: '#cbbfe0', sum: true },
  { id: 'V', label: '휴가', color: '#f3cf7a', sum: true },
  { id: 'N', label: '앙포레', color: '#f5b8c9', sum: false },
  { id: 'B', label: '밀본', color: '#b7ddb0', sum: false },
  { id: 'E', label: '교육', color: '#a9d3ea', sum: false },
];
function typeOf(state, code) {
  return code ? (state.types.find((t) => t.id === code) || null) : null;
}
function inkFor(hex) {
  const h = String(hex || '#cccccc').replace('#', '');
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) > 140 ? '#1c1f24' : '#ffffff';
}
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const pad = (n) => String(n).padStart(2, '0');
const ymKey = (y, m) => y + '-' + pad(m);
const dKey = (y, m, d) => y + '-' + pad(m) + '-' + pad(d);
const daysIn = (y, m) => new Date(y, m, 0).getDate();
const dowOf = (y, m, d) => new Date(y, m - 1, d).getDay();

/* 음력 기준 명절 (설날, 부처님오신날, 추석 당일) */
const LUNAR = {
  2025: { s: '01-29', b: '05-05', c: '10-06' },
  2026: { s: '02-17', b: '05-24', c: '09-25' },
  2027: { s: '02-07', b: '05-13', c: '09-15' },
  2028: { s: '01-27', b: '05-02', c: '10-03' },
  2029: { s: '02-13', b: '05-20', c: '09-22' },
  2030: { s: '02-03', b: '05-09', c: '09-12' },
};
const EXTRA_HOL = {
  '2025-01-27': '임시공휴일',
  '2025-06-03': '대통령선거일',
  '2026-06-03': '지방선거일',
  '2028-04-12': '국회의원선거일',
};
const HOL_YEARS = Object.keys(LUNAR).map(Number);

const _holCache = {};
/* 해당 연도 공휴일: { 'MM-DD': ['이름', ...] } */
function holidaysOf(year) {
  if (_holCache[year]) return _holCache[year];
  const map = {};
  const md = (dt) => pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
  const at = (s, delta) => {
    const [m, d] = s.split('-').map(Number);
    return new Date(year, m - 1, d + (delta || 0));
  };
  const add = (dt, name) => {
    if (dt.getFullYear() !== year) return;
    (map[md(dt)] = map[md(dt)] || []).push(name);
  };
  const singles = [['03-01', '삼일절'], ['05-05', '어린이날'], ['08-15', '광복절'],
    ['10-03', '개천절'], ['10-09', '한글날'], ['12-25', '성탄절']];
  if (year >= 2026) singles.push(['05-01', '노동절'], ['07-17', '제헌절']);
  const L = LUNAR[year];
  if (L) singles.push([L.b, '부처님오신날']);
  const blocks = [];
  if (L) blocks.push([L.s, '설날'], [L.c, '추석']);

  add(at('01-01'), '신정');
  add(at('06-06'), '현충일');
  singles.forEach(([s, n]) => add(at(s), n));
  blocks.forEach(([s, n]) => {
    add(at(s, -1), n + ' 연휴'); add(at(s), n); add(at(s, 1), n + ' 연휴');
  });

    if (k.startsWith(year + '-')) add(at(k.slice(5)), EXTRA_HOL[k]);

  const trig = new Map();
  blocks.forEach(([s, bn]) => {
    for (let i = -1; i <= 1; i++) {
      const dt = at(s, i);
      if (dt.getFullYear() !== year) continue;
      const k = md(dt);
      if ((dt.getDay() === 0 || map[k].length > 1) && !trig.has(k)) trig.set(k, { after: at(s, 1), name: bn });

  });
  return (_holCache[year] = map);
}

/* 한 달의 날짜 정보: [null, {d, dow, red, notes:[{t, type}]}, ...] */
function dayInfo(state, y, m) {
  const hol = holidaysOf(y);
  const hidden = new Set(state.hideHol || []);
  const out = [null];
  const n = daysIn(y, m);
  for (let d = 1; d <= n; d++) {
    const wd = dowOf(y, m, d);
    const key = dKey(y, m, d);
    const notes = [];
    let red = wd === 0 || wd === 6;
    const hs = hol[key.slice(5)];
    if (hs && !hidden.has(key)) { hs.forEach((t) => notes.push({ t, type: 'hol' })); red = true; }
    (state.events || []).forEach((e) => {
      if (e.yearly ? e.date.slice(5) === key.slice(5) && e.date.slice(0, 4) <= String(y) : e.date === key) {
        notes.push({ t: e.name, type: e.red ? 'hol' : 'ev' });
        if (e.red) red = true;
      }
    });
    out.push({ d, dow: wd, red, notes });
  }
  return out;
}

function fixedDaysAt(st, dateStr) {
  let days = [];
  (st.fixed || []).forEach((f) => { if (f.from <= dateStr) days = f.days; });
  return days;
}
function baseVal(st, y, m, d) {
  return fixedDaysAt(st, dKey(y, m, d)).includes(dowOf(y, m, d)) ? 'O' : '';
}
function cellVal(state, st, y, m, d) {
  const mo = state.ov[ymKey(y, m)];
  const ov = mo && mo[st.id] && mo[st.id][d];
  if (ov === 'W') return '';
  if (ov && typeOf(state, ov)) return ov;

}
function setCell(state, st, y, m, d, code) {
  const k = ymKey(y, m);
  const base = baseVal(st, y, m, d);
  const mo = (state.ov[k] = state.ov[k] || {});
  const row = (mo[st.id] = mo[st.id] || {});
  if (code === base) delete row[d]; else row[d] = code || 'W';
  if (!Object.keys(row).length) delete mo[st.id];
  if (!Object.keys(mo).length) delete state.ov[k];
}
function setFixed(st, fromDate, days) {
  st.fixed = (st.fixed || []).filter((f) => f.from < fromDate);
  st.fixed.push({ from: fromDate, days: days.slice().sort() });
}
function visibleStaff(state, ym) {
  return state.staff.filter((s) => (!s.start || s.start <= ym) && (!s.end || ym <= s.end));
}
function countGroupOf(st) {

}
/* 직급별 근무 인원: { groupId: [_, n1, n2, ...] } */
function workCounts(state, y, m) {
  const n = daysIn(y, m);
  const res = {};
  state.groups.forEach((g) => { res[g.id] = new Array(n + 1).fill(0); });
  visibleStaff(state, ymKey(y, m)).forEach((st) => {
    const g = countGroupOf(st);
    if (!g || !res[g]) return;
    for (let d = 1; d <= n; d++) if (!cellVal(state, st, y, m, d)) res[g][d]++;

}
function staffTotals(state, st, y, m) {
  const t = {};
  const n = daysIn(y, m);
  for (let d = 1; d <= n; d++) {
    const v = cellVal(state, st, y, m, d);
    if (v) t[v] = (t[v] || 0) + 1;
  }
  return t;
}

function seedState() {
  const all = '2000-01-01';
  const S = (id, name, group, days, countAs) => ({
    id, name, group, countAs: countAs || 'auto', fixed: [{ from: all, days }],
  });
  return {
    v: 1, ts: 0,
    groups: [
      { id: 'g1', name: '대표', count: false },
      { id: 'g2', name: '관리자', count: false },
      { id: 'g3', name: '디자이너', count: true },
      { id: 'g4', name: '인턴', count: true },
    ],
    staff: [
      S('s1', '매니저', 'g2', [3, 4, 5]), S('s2', '써니', 'g2', [0, 1, 2]),
      S('s3', '양건', 'g2', [0, 1]), S('s4', '은파', 'g2', [0, 1], 'g3'),
      S('s5', '최강', 'g3', [2, 3]), S('s6', '소유', 'g3', [1, 2]),
      S('s7', '나현', 'g3', [0, 4]), S('s8', '일류', 'g3', [3, 4]),
      S('s9', '선영', 'g3', [5]),
      S('s10', '염익', 'g4', [0, 1]), S('s11', '가윤', 'g4', [1, 2, 3]),
      S('s12', '은빈', 'g4', [2, 4, 5]), S('s13', '다희', 'g4', [3, 4]),
      S('s14', '규석', 'g4', [1, 2]),
    ],
    ov: {}, events: [], hideHol: [],

    seq: 100,

function normalize(s) {
  const d = seedState();
  if (!s || typeof s !== 'object') return d;
  s.groups = Array.isArray(s.groups) ? s.groups : d.groups;
  s.staff = Array.isArray(s.staff) ? s.staff : [];
  s.ov = s.ov && typeof s.ov === 'object' ? s.ov : {};
  s.events = Array.isArray(s.events) ? s.events : [];
  s.hideHol = Array.isArray(s.hideHol) ? s.hideHol : [];
  if (!Array.isArray(s.types) || !s.types.length) {
    const c = s.colors || {};
    const old = { O: c.off, A: c.leave, V: c.vac, E: c.edu };
    s.types = DEFAULT_TYPES.map((t) => Object.assign({}, t, old[t.id] ? { color: old[t.id] } : {}));
  }
  if (!s.types.some((t) => t.id === 'O')) s.types.unshift(Object.assign({}, DEFAULT_TYPES[0]));
  delete s.colors;
  Object.values(s.ov).forEach((mo) => Object.values(mo || {}).forEach((row) => {
    Object.keys(row || {}).forEach((d) => { if (row[d] === 'M') row[d] = 'A'; });
  }));
  s.seq = s.seq || 100;
  s.ts = s.ts || 0;
  return s;
}

(function () {

  $('typesBody').addEventListener('click', (e) => {

      if (j < 0 || j >= state.types.length) return;

    } else if (d.tdel) {

  $('typesBody').addEventListener('change', (e) => {

  const move = (dm) => { let m = view.m + dm, y = view.y; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } view = { y, m }; renderGrid(); };

          <label class="lbl" for="sc-${st.id}">인원 집계 <select id="sc-${st.id}" data-scount="${st.id}">
            <option value="auto" ${(!st.countAs || st.countAs === 'auto') ? 'selected' : ''}>소속 직급</option>` +
          state.groups.filter((x) => x.id !== st.group).map((x) => `<option value="${x.id}" ${x.id === st.countAs ? 'selected' : ''}>${esc(x.name)}</option>`).join('') +
          `<option value="none" ${st.countAs === 'none' ? 'selected' : ''}>집계 안 함</option></select></label>
          <span class="spacer"></span>
          <button class="btn small danger" data-sdel="${st.id}">${view.m}월부터 제외</button></div>`;

    });
    h += '<div><button class="btn" id="gadd">+ 직급 추가</button></div>';
    $('staffBody').innerHTML = h;
    if (focusId) { const el = $('sn-' + focusId); if (el) { el.focus(); el.select(); } }
  }
  function openStaff(focusId) { renderStaff(focusId); if (!$('dlgStaff').open) $('dlgStaff').showModal(); if (focusId) { const el = $('sn-' + focusId); if (el) { el.focus(); el.select(); } } }
  $('openStaff').onclick = () => openStaff();
  const prevYm = () => (view.m === 1 ? ymKey(view.y - 1, 12) : ymKey(view.y, view.m - 1));
  $('staffBody').addEventListener('click', (e) => {
    const t = e.target.closest('button'); if (!t) return;
    const d = t.dataset; const ym = ymKey(view.y, view.m);
    let focus = null;

    } else if (d.smove) {

  $('staffBody').addEventListener('change', (e) => {

  /* ----- 공휴일·기념일 ----- */

      `<div class="li"><span class="dt">${e.yearly ? '매년 ' + e.date.slice(5).replace('-', '/') : e.date}</span><span class="nm" style="color:var(${e.red ? '--red' : '--ev'})">${esc(e.name)}</span><button class="btn small danger" data-evdel="${e.id}">삭제</button></div>`).join('')
      : '<p class="note">아직 없습니다. 달력의 날짜 숫자를 눌러도 추가할 수 있습니다.</p>') + '</div></div>';
    h += `<div><h3>${y}년 공휴일</h3>` + (HOL_YEARS.includes(y) ? '' : '<p class="note">이 연도는 설날·추석·부처님오신날 날짜가 들어 있지 않습니다. 위에서 직접 추가하세요.</p>') +
      '<p class="note">매장에서 쓰지 않는 날은 체크를 끄면 달력에서 빠집니다.</p><div class="list">' +
      Object.keys(hol).sort().map((k) => { const key = y + '-' + k; return `<div class="li"><span class="dt">${k.replace('-', '/')} (${WD[new Date(y, +k.slice(0, 2) - 1, +k.slice(3)).getDay()]})</span><label class="nm" for="h-${key}">${esc(hol[k].join(' · '))}</label><input type="checkbox" id="h-${key}" data-hol="${key}" ${hidden.has(key) ? '' : 'checked'} aria-label="표시"></div>`; }).join('') + '</div></div>';

  function openEvents(date) { evDate = date || null; renderEvents(); if (!$('dlgEvents').open) $('dlgEvents').showModal(); if (date) $('evName').focus(); }
  $('openEvents').onclick = () => openEvents();
  $('eventsBody').addEventListener('submit', (e) => {
    e.preventDefault();
    const date = $('evDate').value, name = $('evName').value.trim();
    if (!date || !name) return;

    evDate = date; commit(); renderGrid(); renderEvents();

  $('eventsBody').addEventListener('click', (e) => {
    const b = e.target.closest('[data-evdel]'); if (!b) return;

  $('eventsBody').addEventListener('change', (e) => {

  /* ----- JPG · PDF 저장 ----- */
  async function drawSheet(S) {
    const { y, m } = view; const n = daysIn(y, m); const info = dayInfo(state, y, m);
    const staff = visibleStaff(state, ymKey(y, m)); const counts = workCounts(state, y, m);
    const sumT = state.types.filter((t) => t.sum);
    const FF = '"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
    try { await Promise.all([document.fonts.load('500 14px ' + FF, '가'), document.fonts.load('700 14px ' + FF, '가')]); } catch (e) {}
    const P = 24, W_NO = 34, W_NAME = 92, W_D = 44, W_S = 50;
    const H_T = 60, H_H = 30, H_SEP = 22, H_R = 34, H_C = 36, H_L = 44;
    const C = { ink: '#1c1f24', red: '#d6262b', ev: '#6b3fa0', line: '#8a8f98', sep: '#e9ebee', muted: '#5f656e' };
    const cv = document.createElement('canvas'); const g = cv.getContext('2d');
    const font = (w, s) => { g.font = `${w} ${s}px ${FF}`; };
    const wrap = (t, w) => { const out = []; let cur = ''; for (const ch of t) { if (cur && g.measureText(cur + ch).width > w) { out.push(cur); cur = ch; } else cur += ch; } if (cur) out.push(cur); return out; };
    font(600, 11);
    const noteLines = info.map((x) => (x ? x.notes.flatMap((nt) => wrap(nt.t, W_D - 6).map((t) => ({ t, type: nt.type }))) : []));
    const maxL = Math.max(0, ...noteLines.map((l) => l.length));
    const H_N = maxL ? maxL * 13 + 8 : 0;
    const groups = state.groups.map((gr) => ({ gr, list: staff.filter((s) => s.group === gr.id) })).filter((x) => x.list.length);
    const cg = state.groups.filter((gr) => gr.count);
    const tableW = W_NO + W_NAME + n * W_D + sumT.length * W_S;
    const tableH = H_T + 2 * H_H + H_N + groups.reduce((a, x) => a + H_SEP + x.list.length * H_R, 0) + (cg.length ? H_SEP + cg.length * H_C : 0);
    cv.width = (tableW + 2 * P) * S; cv.height = (tableH + 2 * P + H_L) * S;
    g.scale(S, S);
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, cv.width, cv.height);
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineWidth = 1; g.strokeStyle = C.line;
    const box = (x, yy, w, hh, fill) => { if (fill) { g.fillStyle = fill; g.fillRect(x, yy, w, hh); } g.strokeRect(x + 0.5, yy + 0.5, w, hh); };
    const text = (t, x, yy, w, hh, color) => { g.fillStyle = color || C.ink; g.fillText(String(t), x + w / 2, yy + hh / 2 + 1); };
    const X0 = P, XD = P + W_NO + W_NAME, XS = XD + n * W_D;
    const dx = (d) => XD + (d - 1) * W_D;
    let yy = P;
    const headH = H_T + 2 * H_H + H_N;
    box(X0, yy, W_NO + W_NAME, headH); font(700, 17); text('구분', X0, yy, W_NO + W_NAME, headH);
    box(XD, yy, n * W_D + sumT.length * W_S, H_T); font(700, 26); text(`${y}년 ${m}월 근무표`, XD, yy, n * W_D + sumT.length * W_S, H_T);
    yy += H_T;
    const yDays = yy;
    const subH = 2 * H_H + H_N;
    sumT.forEach((t, i) => {
      const x = XS + i * W_S; box(x, yy, W_S, subH); font(600, 12);
      const ls = wrap(t.label, W_S - 8);
      ls.forEach((ln, k) => text(ln, x, yy + (k - (ls.length - 1) / 2) * 15, W_S, subH));
    });
    for (let d = 1; d <= n; d++) {
      const col = info[d].red ? C.red : C.ink;
      font(700, 14);
      box(dx(d), yy, W_D, H_H); text(d, dx(d), yy, W_D, H_H, col);
      box(dx(d), yy + H_H, W_D, H_H); text(WD[info[d].dow], dx(d), yy + H_H, W_D, H_H, col);
      if (H_N) {
        box(dx(d), yy + 2 * H_H, W_D, H_N); font(600, 11);
        noteLines[d].forEach((ln, i) => text(ln.t, dx(d), yy + 2 * H_H + 4 + i * 13, W_D, 13, ln.type === 'hol' ? C.red : C.ev));
      }
    }
    yy += subH;
    const sepRow = (label) => { box(X0, yy, tableW, H_SEP, C.sep); font(700, 11); g.textAlign = 'left'; g.fillStyle = C.muted; g.fillText(label, X0 + 8, yy + H_SEP / 2 + 1); g.textAlign = 'center'; yy += H_SEP; };
    groups.forEach(({ gr, list }) => {
      sepRow(gr.name);
      list.forEach((st, i) => {
        box(X0, yy, W_NO, H_R); font(500, 12); text(i + 1, X0, yy, W_NO, H_R, C.muted);
        box(X0 + W_NO, yy, W_NAME, H_R); font(700, 14);
        let nm = st.name; while (nm.length > 1 && g.measureText(nm).width > W_NAME - 8) nm = nm.slice(0, -1);
        text(nm, X0 + W_NO, yy, W_NAME, H_R);
        for (let d = 1; d <= n; d++) {
          const t = typeOf(state, cellVal(state, st, y, m, d));
          box(dx(d), yy, W_D, H_R, t ? t.color : null);
          if (t) { const L = [...t.label].length; font(700, L <= 2 ? 13 : L === 3 ? 12 : 10.5); text(t.label, dx(d), yy, W_D, H_R, inkFor(t.color)); }
        }
        const tot = staffTotals(state, st, y, m); font(500, 13);
        sumT.forEach((t, k) => { box(XS + k * W_S, yy, W_S, H_R); if (tot[t.id]) text(tot[t.id], XS + k * W_S, yy, W_S, H_R, C.muted); });
        yy += H_R;
      });
    });
    if (cg.length) {
      sepRow('근무 인원');
      cg.forEach((gr) => {
        box(X0, yy, W_NO + W_NAME, H_C); font(700, 14); text(gr.name, X0, yy, W_NO + W_NAME, H_C);
        for (let d = 1; d <= n; d++) { box(dx(d), yy, W_D, H_C); text(counts[gr.id][d], dx(d), yy, W_D, H_C, info[d].red ? C.red : C.ink); }
        sumT.forEach((t, k) => box(XS + k * W_S, yy, W_S, H_C));
        yy += H_C;
      });
    }
    // 주 구분 굵은 선 (월요일 앞)
    g.strokeStyle = C.ink; g.lineWidth = 2.5;
    for (let d = 2; d <= n; d++) if (info[d].dow === 1) { g.beginPath(); g.moveTo(dx(d) + 0.5, yDays); g.lineTo(dx(d) + 0.5, yy); g.stroke(); }
    g.strokeStyle = C.line; g.lineWidth = 1;
    yy += 14; font(500, 13); g.textAlign = 'left';

  $('name').value = s.name || '';
  $('month').value = s.month || '';
  $('pctManual').checked = !!s.pctManual;
  $('pctValue').value = s.pctValue || '';
  MONEY_IDS.forEach(function (id) { $(id).value = s[id] ? Number(s[id]).toLocaleString('ko-KR') : ''; });
}
function save() {
  try {
    var s = read(); s.name = $('name').value; s.month = $('month').value;
    localStorage.setItem(KEY, JSON.stringify(s));
  } catch (e) {}
}
var last = null;
function render() {
  var v = read(), o = calc(v);
  last = { v: v, o: o };
  SERVICE.forEach(function (d) {
    var el = $('c_' + d.id);
    if (d.out) { el.textContent = '− ' + won(o[d.out]); el.className = 'calc minus'; }
    else if (d.plus) { el.textContent = v.points ? '+ ' + won(v.points) : ''; el.className = 'calc plus'; }
  });
  $('outSettle').textContent = won(o.settle);
  $('outSettleNet').textContent = won(o.settleNet);
  ['rCardFee','bCardFee','rNaverFee','bNaverFee'].forEach(function (k) { $(k).textContent = '− ' + won(o[k]); });
  ['rSettle','bSettle','rNet','bNet','rAllow','bRef'].forEach(function (k) { $(k).textContent = won(o[k]); });

  var rows = $('tierTable').querySelectorAll('tbody tr');
  for (var i = 0; i < rows.length; i++) {
    var on = rows[i].getAttribute('data-role') === v.role;
    rows[i].className = on ? 'on' : '';
    var tds = rows[i].querySelectorAll('td[data-step]');
    for (var j = 0; j < tds.length; j++) tds[j].className = (on && Number(tds[j].getAttribute('data-step')) === o.tier) ? 'on' : '';
  }
  $('pctManualBox').hidden = !v.pctManual;
  var pctText = (Math.round(o.pct * 100) / 100) + '%';
  $('outPct').textContent = pctText;
  $('outCommission').textContent = won(o.commission);
  $('slipPctLabel').textContent = '시술 프로테이지 (' + pctText + ')';

  $('sCommission').textContent = won(o.commission);
  $('sRAllow').textContent = won(o.rAllow);
  $('sBAllow').textContent = won(v.bAllow);
  $('sExtra').textContent = won(v.extra);
  $('sGross').textContent = won(o.gross);
  $('sTax').textContent = '− ' + won(o.tax);
  $('sTotal').textContent = won(o.total);
  $('sDeduct').textContent = '− ' + won(o.deduct);
  $('sNet').textContent = won(o.net);
  $('outNet').textContent = won(o.net) + '원';
  var m = $('month').value, who = [];
  if (m) who.push(m.slice(0, 4) + '년 ' + Number(m.slice(5)) + '월');
  who.push(ROLES[v.role].label);
  if ($('name').value.trim()) who.push($('name').value.trim());
  $('slipWho').textContent = who.join(' · ');
}
function slipText() {
  var v = last.v, o = last.o;
  return [
    $('slipWho').textContent + ' 급여 명세',
    '이달매출(점판제외) ' + won(v.sales) + ' / 포인트결제 ' + won(v.points),
    '급여정산매출 ' + won(o.settle) + ' → 부가세 제외 ' + won(o.settleNet),
    '시술 프로테이지(' + $('outPct').textContent + ') ' + won(o.commission),
    '점판수당 ' + won(o.rAllow) + ' / 블랭크 점판수당 ' + won(v.bAllow),
    '강의료 및 수당 ' + won(v.extra),
    '합계 ' + won(o.gross),
    '원천징수(3.3%) -' + won(o.tax),
    '시술 토탈 급여 ' + won(o.total),
    '공제액 -' + won(o.deduct) + ' (제품구입+본인시술 ' + won(v.dProduct) + ', 식비 ' + won(v.dMeal) + ', 재시술 ' + won(v.dRedo) + ', 네이버문자 ' + won(v.dSms) + ')',
    '실지급액 ' + won(o.net) + '원'
  ].join('\n');
}

buildRows($('serviceRows'), SERVICE);
buildRows($('extraRows'), EXTRA);
buildTiers();

var stored = null;
try { stored = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
fill(stored || EXAMPLE);
$('exampleBadge').hidden = !!stored;
render();

root.addEventListener('input', function (e) {
  var t = e.target;
  if (t.classList && t.classList.contains('money')) {
    var digits = t.value.replace(/[^0-9]/g, '');
    t.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
  }
  $('exampleBadge').hidden = true;
  render(); save();
});
root.addEventListener('change', function () { render(); save(); });
$('btnRef').addEventListener('click', function () {
  $('bAllow').value = won(last.o.bRef);
  $('exampleBadge').hidden = true;
  render(); save();
});
$('btnClear').addEventListener('click', function () {
  fill({ role: $('role').value });
  $('exampleBadge').hidden = true;
  render(); save();
});
$('btnCopy').addEventListener('click', function () {
  var msg = $('copyMsg');
  try {
    navigator.clipboard.writeText(slipText()).then(function () { msg.textContent = '복사했습니다.'; },
      function () { msg.textContent = '복사가 막혀 있습니다. 화면 내용을 직접 선택해 주세요.'; });
  } catch (e) { msg.textContent = '복사가 막혀 있습니다. 화면 내용을 직접 선택해 주세요.'; }
  setTimeout(function () { msg.textContent = ''; }, 4000);
});

  /* 탭 전환: 주소 끝의 #schedule / #pay 를 따른다 */
  var VIEWS = { schedule: roster, pay: root };
  function show(tab) {
    if (!VIEWS[tab]) tab = 'schedule';
    Object.keys(VIEWS).forEach(function (k) { VIEWS[k].hidden = k !== tab; });
    var bs = document.querySelectorAll('#tabs .tab');
    for (var i = 0; i < bs.length; i++) bs[i].setAttribute('aria-pressed', String(bs[i].getAttribute('data-tab') === tab));
  }
  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('.tab'); if (!b) return;
    var tab = b.getAttribute('data-tab');
    show(tab);
    try { if (location.hash !== '#' + tab) location.hash = tab; } catch (err) {}
  });
  window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });
  show(location.hash.slice(1));
})();
</script>
</body>
